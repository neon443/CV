
name: Build and publish CV

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-lang-english \
            poppler-utils \
            imagemagick

      - name: Compile CV
        working-directory: src
        run: |
          latexmk -pdf -interaction=nonstopmode cv.tex

      - name: Prepare website
        run: |
          mkdir -p site
          cp src/cv.pdf site/nihaal-cv.pdf
          cp index.html site/index.html

      - name: Generate social preview image
        working-directory: site
        run: |
          pdftoppm -f 1 -l 1 -r 300 -png nihaal-cv.pdf preview
          convert preview-1.png \
            -resize 1200x \
            -crop 1200x630+0+0 +repage \
            \( -size 1200x200 gradient:none-white \) \
            -gravity south -composite \
            preview.webp

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: nihaal-cv
          path: site/nihaal-cv.pdf
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
